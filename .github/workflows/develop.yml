name: Build develop artifacts

# Builds the app on every push to the working branch (and on demand) and keeps
# the results as workflow artifacts. It publishes nothing: releases are cut by
# release.yml on a vX.Y.Z tag. This exists so a broken build is noticed here
# instead of when a release is cut, and so a fix can be installed on a device
# for testing without cutting a release.
#
# The APK is signed with the same key as a release, so it installs over the
# published one and keeps the notes.
on:
  push:
    branches:
      - develop
    paths:
      - 'lib/**'
      - 'linux/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/develop.yml'
  workflow_dispatch:

jobs:
  appimage:
    name: Build and smoke test the AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: 'stable'
          cache: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          # lld is the linker Flutter's native-assets build uses for sqlite3.
          sudo apt-get install -y clang lld cmake ninja-build pkg-config \
            libgtk-3-dev libsecret-1-dev libjsoncpp-dev xvfb

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build the AppImage
        run: bash linux/package-appimage.sh

      - name: Smoke test the AppImage
        # The runner has no display: a virtual one is enough to prove the
        # binary starts, loads the Flutter engine and keeps running.
        run: |
          set -euo pipefail
          xvfb-run -a bash -c '
            ./build/appimage/kMemo-*-x86_64.AppImage --appimage-extract-and-run > appimage.log 2>&1 &
            sleep 25
            if pgrep -x kmemo > /dev/null; then
              echo "kMemo is running"
            else
              echo "kMemo did not start:"
              cat appimage.log
              exit 1
            fi
            pkill -x kmemo || true
          '
          # A crash inside the app (not just a missing window) shows up here.
          if grep -q "Unhandled Exception" appimage.log; then
            echo "the app reported an unhandled exception:"
            cat appimage.log
            exit 1
          fi

      - name: Upload the AppImage
        uses: actions/upload-artifact@v4
        with:
          name: kmemo-appimage
          path: build/appimage/kMemo-*-x86_64.AppImage
          retention-days: 14
          if-no-files-found: error

  apk:
    name: Build the Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: 'stable'
          cache: false

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Decode Keystore and Create Properties
        # Same key as the release build: the artifact installs over the
        # published APK, so a tester keeps the notes and the sync settings.
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > upload-keystore.jks
          echo "storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=../../upload-keystore.jks" >> android/key.properties

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: kmemo-apk-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 14
          if-no-files-found: error
