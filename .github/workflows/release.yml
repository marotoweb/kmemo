name: Build Android Release APK
run-name: "Release ${{ github.ref_name }}"

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-android:
    name: Build Flutter App for Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: 'stable'
          cache: false

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Decode Keystore and Create Properties
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > upload-keystore.jks
          echo "storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=../../upload-keystore.jks" >> android/key.properties

      - name: Reproducible build patches
        run: |
          find "$PUB_CACHE" -name "CMakeLists.txt" -path "*jni*" -exec sed -i -e '1a add_link_options("LINKER:--build-id=none")' {} \;
          find "$PUB_CACHE" -name "CMakeLists.txt" -path "*jni*" -exec sed -i -e "1a add_compile_options(\"-ffile-prefix-map=$GITHUB_WORKSPACE=/tmp/build\")" {} \;

      - name: Build APK
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: Rename APKs
        run: |
          for abi in armeabi-v7a arm64-v8a x86_64; do
            mv "build/app/outputs/flutter-apk/app-${abi}-release.apk" "kMemo-${{ github.ref_name }}-${abi}.apk"
          done

      # The desktop build is best effort: a packaging failure must not block
      # the Android release, which is what F-Droid and the Play listing use.
      - name: Install Linux build dependencies
        continue-on-error: true
        run: |
          sudo apt-get update
          # lld is what Flutter's native-assets build uses as the linker for
          # sqlite3; without it "flutter build linux" stops with
          # "Failed to find any of [ld.lld, ld]".
          sudo apt-get install -y clang lld cmake ninja-build pkg-config \
            libgtk-3-dev libsecret-1-dev libjsoncpp-dev

      - name: Build Linux AppImage
        continue-on-error: true
        run: |
          # No --no-build: the workflow has no Flutter bundle yet, so the
          # script runs "flutter build linux --release" itself.
          bash linux/package-appimage.sh
          VERSION="$(sed -n 's/^version:[[:space:]]*\([^+ ]*\).*/\1/p' pubspec.yaml | head -1)"
          mv "build/appimage/kMemo-${VERSION}-x86_64.AppImage" \
             "kMemo-${{ github.ref_name }}-x86_64.AppImage"

      - name: Extract current release notes
        run: |
          TAG="${{ github.ref_name }}"
          VERSION=$(echo "$TAG" | sed 's/^v//')
          echo "A extrair notas para a versão: $VERSION"
          echo "RELEASE_BODY<<EOF_MARKER" >> $GITHUB_ENV
          sed -n "/^## $VERSION/,/^## /p" CHANGELOG.md | sed '1d;$d' >> $GITHUB_ENV
          echo "EOF_MARKER" >> $GITHUB_ENV

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            kMemo-${{ github.ref_name }}-*.apk
            kMemo-${{ github.ref_name }}-x86_64.AppImage
          name: "kMemo ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          body: ${{ env.RELEASE_BODY }}